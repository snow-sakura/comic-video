# Alembic 配置 — AI 漫剧工坊后端数据库迁移
# 用法：
#   alembic upgrade head          # 应用到最新
#   alembic revision --autogenerate -m "说明"  # 生成迁移
[alembic]
script_location = alembic
prepend_sys_path = .
# 迁移文件命名：时间戳_说明
file_template = %%(rev)s_%%(slug)s.sql

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
