# 在线体验 Demo 部署：demo/ → GitHub Pages（纯静态，零依赖零数据库）
# 每次 push 到 main 自动重新部署；也可在 Actions 页手动触发。
name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["demo/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用 GitHub Pages（由 workflow 的 pages:write 权限驱动，
          # 不依赖个人 token 权限），source 设为 GitHub Actions 构建模式
          enablement: true

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
